applications:
  evilginx:
    type: golang:1.26  # Use latest Go runtime from Registry

    hooks:
      build: |
        set -ex
        go mod download
        go build -o ./bin/evilginx main.go

    web:
      commands:
        start: ./bin/evilginx --port=$PORT
      locations:
        /:
          passthru: true  # Proxy all requests to the app

    mounts:
